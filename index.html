  /* Imagen de fondo */

 html {

body {

}
  }

  /* Oscurecimiento suave para que el texto sea legible */

  .overlay {
    position: absolute;
    inset: 0;

    background:
      linear-gradient(
        to bottom,

<div class="widget">

  <!-- Imagen -->
  <div class="background" id="background"></div>

  <!-- Capa para mejorar legibilidad -->
  <div class="overlay"></div>

  <div class="content">

    <!-- ARRIBA -->
    <div class="top">

      <div class="session-label" id="sessionLabel">
        FOCUS
      </div>

      <button
        class="image-button"
        id="imageButton"
        title="Cambiar imagen"
      >
        🖼
      </button>

    </div>

    <!-- CENTRO -->
    <div class="center">

      <div class="timer" id="timer">
        30:00
      </div>

      <div class="session-name" id="sessionName">
        Pomodoro 1
      </div>

    </div>

    <!-- ABAJO -->
    <div class="bottom">

      <!-- Progreso -->
      <div class="progress" id="progress"></div>

      <!-- Controles -->
      <div class="controls">

        <button
          class="control"
          id="resetButton"
        >
          ↻
        </button>

        <button
          class="control main"
          id="startButton"
        >
          Iniciar
        </button>

        <button
          class="control"
          id="skipButton"
        >
          →
        </button>

      </div>

      <!-- Preset -->
      <div class="preset-area">

        <select
          class="preset"
          id="preset"
        >
          <option value="0">
            30 · 5 · 15
          </option>

          <option value="1">
            50 · 9 · 20
          </option>

<input
  type="file"

<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const presets = [

  {
    focus: 30,
    shortBreak: 5,
    longBreak: 15
  },

  {
    focus: 50,
    shortBreak: 9,
    longBreak: 20
  }

];


/* =====================================================
   ESTADO
   ===================================================== */

let currentPreset = 0;

let sessionType = "focus";

let pomodoroNumber = 1;

let remainingSeconds = presets[0].focus * 60;

let timerInterval = null;

let running = false;


/* =====================================================
   ELEMENTOS
   ===================================================== */

const timerElement =
  document.getElementById("timer");

const sessionLabel =
  document.getElementById("sessionLabel");

const sessionName =
  document.getElementById("sessionName");

const progress =
  document.getElementById("progress");

const startButton =
  document.getElementById("startButton");

const resetButton =
  document.getElementById("resetButton");

const skipButton =
  document.getElementById("skipButton");

const presetSelect =
  document.getElementById("preset");

const background =
  document.getElementById("background");

const imageInput =
  document.getElementById("imageInput");

const imageButton =
  document.getElementById("imageButton");

const removeImage =
  document.getElementById("removeImage");


/* =====================================================
   TIEMPO ACTUAL
   ===================================================== */

function getCurrentMinutes() {

  const preset = presets[currentPreset];

  if (sessionType === "focus") {
    return preset.focus;
  }

  if (sessionType === "short") {
    return preset.shortBreak;
  }

  return preset.longBreak;
}


/* =====================================================
   FORMATO DEL TIMER
   ===================================================== */

function formatTime(seconds) {

  const minutes =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");

  const secs =
    (seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${minutes}:${secs}`;
}


/* =====================================================
   ACTUALIZAR TIMER
   ===================================================== */

function updateTimer() {

  timerElement.textContent =
    formatTime(remainingSeconds);

}


/* =====================================================
   ETIQUETA DE SESIÓN
   ===================================================== */

function updateSessionInfo() {

  if (sessionType === "focus") {

    sessionLabel.textContent = "FOCUS";

    sessionName.textContent =
      `Pomodoro ${pomodoroNumber}`;

  }

  else if (sessionType === "short") {

    sessionLabel.textContent =
      "SHORT BREAK";

    sessionName.textContent =
      "Descanso corto";

  }

  else {

    sessionLabel.textContent =
      "LONG BREAK";

    sessionName.textContent =
      "Descanso largo";

  }

}


/* =====================================================
   PROGRESO
   ===================================================== */

function updateProgress() {

  progress.innerHTML = "";

  for (let i = 1; i <= 3; i++) {

    const dot =
      document.createElement("div");

    dot.classList.add("dot");

    if (i < pomodoroNumber) {
      dot.classList.add("completed");
    }

    if (
      sessionType === "focus" &&
      i === pomodoroNumber
    ) {
      dot.classList.add("active");
    }

    if (
      sessionType === "short" &&
      i === pomodoroNumber
    ) {
      dot.classList.add("active");
    }

    if (
      sessionType === "long" &&
      i === 3
    ) {
      dot.classList.add("active");
    }

    progress.appendChild(dot);

  }

}


/* =====================================================
   ACTUALIZAR TODO
   ===================================================== */

function updateUI() {

  updateTimer();

  updateSessionInfo();

  updateProgress();

}


/* =====================================================
   INICIAR / PAUSAR
   ===================================================== */

function toggleTimer() {

  if (running) {

    clearInterval(timerInterval);

    running = false;

    startButton.textContent =
      "Continuar";

    return;
  }


  running = true;

  startButton.textContent =
    "Pausar";


  timerInterval =
    setInterval(() => {

      remainingSeconds--;

      updateTimer();


      if (remainingSeconds <= 0) {

        clearInterval(timerInterval);

        running = false;

        startButton.textContent =
          "Iniciar";

        finishSession();

      }

    }, 1000);

}


/* =====================================================
   TERMINAR SESIÓN
   ===================================================== */

function finishSession() {

  playBeep();

  if (sessionType === "focus") {

    if (pomodoroNumber < 3) {

      pomodoroNumber++;

      sessionType = "short";

    }

    else {

      sessionType = "long";

    }

  }

  else if (sessionType === "short") {

    sessionType = "focus";

  }

  else {

    pomodoroNumber = 1;

    sessionType = "focus";

  }


  remainingSeconds =
    getCurrentMinutes() * 60;

  updateUI();

}


/* =====================================================
   REINICIAR
   ===================================================== */

function resetTimer() {

  clearInterval(timerInterval);

  running = false;

  sessionType = "focus";

  pomodoroNumber = 1;

  remainingSeconds =
    presets[currentPreset].focus * 60;

  startButton.textContent =
    "Iniciar";

  updateUI();

}


/* =====================================================
   SALTAR
   ===================================================== */

function skipSession() {

  clearInterval(timerInterval);

  running = false;

  finishSession();

  startButton.textContent =
    "Iniciar";

}


/* =====================================================
   CAMBIAR PRESET
   ===================================================== */

presetSelect.addEventListener(
  "change",
  () => {

    currentPreset =
      Number(presetSelect.value);

    resetTimer();

  }
);


/* =====================================================
   BOTONES
   ===================================================== */

startButton.addEventListener(
  "click",
  toggleTimer
);

resetButton.addEventListener(
  "click",
  resetTimer
);

skipButton.addEventListener(
  "click",
  skipSession
);


/* =====================================================
   IMAGEN
   ===================================================== */

imageButton.addEventListener(
  "click",
  () => {

    imageInput.click();

  }
);


imageInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) return;


    const reader =
      new FileReader();


    reader.onload =
      event => {

        const img =
          new Image();


        img.onload =
          () => {

            const maxSize = 1200;

            let width =
              img.width;

            let height =
              img.height;


            if (width > maxSize ||
                height > maxSize) {

              const ratio =
                Math.min(
                  maxSize / width,
                  maxSize / height
                );

              width *= ratio;
              height *= ratio;

            }


            const canvas =
              document.createElement("canvas");

            canvas.width = width;
            canvas.height = height;


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            const compressed =
              canvas.toDataURL(
                "image/jpeg",
                0.75
              );


            try {

              localStorage.setItem(
                "pomodoroBackground",
                compressed
              );

            }

            catch (error) {

              console.warn(
                "No se pudo guardar la imagen.",
                error
              );

            }


            setBackground(compressed);

          };


        img.src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   APLICAR IMAGEN
   ===================================================== */

function setBackground(image) {

  if (!image) return;

  background.style.backgroundImage =
    `url("${image}")`;

  removeImage.style.display =
    "block";

}


/* =====================================================
   QUITAR IMAGEN
   ===================================================== */

removeImage.addEventListener(
  "click",
  () => {

    background.style.backgroundImage =
      "";

    localStorage.removeItem(
      "pomodoroBackground"
    );

    removeImage.style.display =
      "none";

    imageInput.value =
      "";

  }
);


/* =====================================================
   CARGAR IMAGEN GUARDADA
   ===================================================== */

const savedImage =
  localStorage.getItem(
    "pomodoroBackground"
  );


if (savedImage) {

  setBackground(savedImage);

}


/* =====================================================
   SONIDO
   ===================================================== */

function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      880;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.5
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.5
    );

  }

  catch (error) {

    console.log(
      "Audio no disponible."
    );

  }

}


/* =====================================================
   INICIALIZAR
   ===================================================== */

updateUI();

</script>

</body>
</html>
